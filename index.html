<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вайб-кодинг под ваши задачи</title>
<meta name="robots" content="noindex">
<style>

:root{
  --bg:#05080B;--panel:#0C1217;--panel2:#0F1A17;--line:#1F2C2A;--tx:#F2F8F5;--tx2:#C9D8D1;--mut:#8EA39B;
  --ac:#5CF2A6;--onac:#04110B;
  --app:#FFFFFF;--app2:#F5F7F9;--appline:#E4E8EC;--apptx:#16212B;--appmut:#6A7783;
  --red:#E5484D;--amber:#D98A0B;--green:#1E9E5E;--blue:#3E7BFA;
  --mono:Consolas,"SFMono-Regular",Menlo,monospace;--body:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
html,body{overflow-x:hidden}
body{background:radial-gradient(900px 600px at 0 0,#0f3a2a 0,transparent 70%) no-repeat,var(--bg);color:var(--tx);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}

/* шапка */
.top{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--mut);letter-spacing:.08em;padding:22px 0 0}
.top b{color:var(--ac)}
.hero{padding:56px 0 34px}
.eb{font:700 12px var(--mono);letter-spacing:.1em;color:var(--tx2);margin-bottom:14px}
.eb:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:8px;vertical-align:1px}
h1{font-size:clamp(32px,5.4vw,56px);line-height:1.05;font-weight:700;letter-spacing:-.01em;margin-bottom:18px}
h1 em{font-style:normal;color:var(--ac)}
.lead{font-size:18px;color:var(--tx2);max-width:740px}
.tasks{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--tx2)}
.chip b{color:var(--ac);font-weight:600}
.hint{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:14px;color:var(--mut)}
.hint i{width:22px;height:22px;border-radius:50%;border:1px solid var(--ac);display:grid;place-items:center;color:var(--ac);font-style:normal;font-size:12px}

.nav{position:sticky;top:0;z-index:20;background:rgba(5,8,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
.nav a{flex:none;text-decoration:none;font:700 13px var(--mono);letter-spacing:.06em;padding:9px 14px;border-radius:10px;border:1px solid var(--line);color:var(--tx2)}
.nav a:hover{border-color:var(--ac);color:var(--ac)}
.nav a.rec{background:var(--ac);color:var(--onac);border-color:var(--ac)}

/* тариф */
.tier{padding:64px 0 20px;border-top:1px solid var(--line)}
.tier:first-of-type{border-top:0}
.thead{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start;margin-bottom:28px}
.tnum{font:700 12px var(--mono);color:var(--ac);letter-spacing:.1em;margin-bottom:10px}
.tname{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.1;margin-bottom:12px}
.tname .badge{display:inline-block;vertical-align:middle;margin-left:10px;font:700 11px var(--mono);letter-spacing:.08em;background:var(--ac);color:var(--onac);padding:5px 10px;border-radius:999px}
.tdesc{background:linear-gradient(135deg,rgba(92,242,166,.11),rgba(92,242,166,.02));border:1px solid rgba(92,242,166,.35);border-radius:18px;padding:20px 22px;color:var(--tx);font-size:16.5px}
.tdesc .dl{font:700 11.5px var(--mono);letter-spacing:.1em;color:var(--ac);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tdesc .plus{background:var(--ac);color:var(--onac);border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.tdesc .key{font-size:clamp(17px,2vw,20px);line-height:1.42;font-weight:600}
.tdesc mark{background:linear-gradient(transparent 60%,rgba(92,242,166,.38) 0);color:inherit;padding:0 2px;border-radius:2px}
.tdesc p+p{margin-top:12px;color:var(--tx2)}
.price{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.price.rec{border-color:var(--ac);background:var(--panel2)}
.price .p{font-size:34px;font-weight:700;white-space:nowrap}
.price .o{font-size:14px;color:var(--mut);margin-top:2px}
.price .m{font-size:15px;color:var(--tx2);margin:6px 0 14px}
.price ul{list-style:none;border-top:1px solid var(--line);padding-top:12px}
.price li{font-size:14.5px;color:var(--tx2);padding-left:16px;position:relative;margin-bottom:6px}
.price li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.res{font:700 12px var(--mono);letter-spacing:.1em;color:var(--mut);margin:6px 0 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.res b{color:var(--ac)}
.res span.try{color:var(--ac);font-weight:400;letter-spacing:.04em}
.note{font-size:13px;color:var(--mut);margin:-8px 0 10px}

/* окно */
.win{background:var(--app);color:var(--apptx);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(92,242,166,.25),0 0 0 1px rgba(255,255,255,.06);margin-bottom:22px;max-width:100%}
.wbar{display:flex;align-items:center;gap:8px;background:#EEF1F4;border-bottom:1px solid var(--appline);padding:10px 14px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.wbar .url{flex:1;min-width:0;margin-left:10px;background:#fff;border:1px solid var(--appline);border-radius:8px;padding:5px 10px;font:12px var(--mono);color:var(--appmut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{padding:20px}
.wtitle{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.wtitle h3{font-size:19px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--app2);color:var(--appmut);border:1px solid var(--appline);white-space:nowrap}
.tag.live{background:#E8F8EF;color:var(--green);border-color:#BFE9D2}
.tag.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.abtn{border:1px solid var(--appline);background:#fff;color:var(--apptx);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
.abtn:hover{border-color:var(--apptx)}
.abtn.pri{background:#0F1A17;color:#fff;border-color:#0F1A17}
.abtn.pri:hover{background:#1C2E27}
.abtn.ok{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.abtn:disabled{opacity:.5;cursor:default}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--app2);border:1px solid var(--appline);border-radius:12px;padding:12px 14px;transition:background .4s}
.kpi.flash{background:#E8F8EF}
.kpi .l{font-size:12.5px;color:var(--appmut)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--amber)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.grid2.eq{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{border:1px solid var(--appline);border-radius:12px;padding:14px;background:#fff;min-width:0}
.card h4{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h4 span{font-weight:400;color:var(--appmut);font-size:12.5px}
.thead>*,.grid2>*,.calc>*,.tg>*,.app>*,.kpis>*,.cmp>*{min-width:0}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--appmut);font-weight:600;font-size:12px;padding:6px;border-bottom:1px solid var(--appline);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid #F0F2F4;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F7FAF9}
tbody tr.sel td{background:#EEF8F3}
.tblwrap{overflow-x:auto}
.st{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st.r{background:#FDECEC;color:var(--red)}.st.a{background:#FEF4E2;color:var(--amber)}.st.g{background:#E8F8EF;color:var(--green)}.st.b{background:#EAF1FF;color:var(--blue)}.st.n{background:var(--app2);color:var(--appmut)}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1px solid var(--appline);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--apptx)}
.fchip b{font-weight:700;margin-left:4px;color:var(--appmut)}
.fchip.on{background:var(--apptx);color:#fff;border-color:var(--apptx)}
.fchip.on b{color:#9fb3c2}

/* aging */
.aging{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#EEF1F4;margin:6px 0 10px}
.aging i{display:block;height:100%;transition:width .6s}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
.legend div{display:flex;justify-content:space-between;gap:6px}
.legend s{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;text-decoration:none}

/* бары */
.chart{position:relative}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bar .pair{display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bar .col{width:46%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#5CF2A6,#1E9E5E);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bar .col.plan{background:repeating-linear-gradient(135deg,#E4E8EC 0 4px,#F2F4F6 4px 8px);border:1px solid #D6DCE1}
.bar .col.solo{width:70%}
.bar .v{font-size:11px;font-weight:600;white-space:nowrap}
.bar .x{font-size:11px;color:var(--appmut);white-space:nowrap}
.bar:hover .col{filter:brightness(.92)}
.tip{position:absolute;pointer-events:none;background:#0F1A17;color:#fff;font-size:12px;border-radius:8px;padding:7px 9px;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:3;line-height:1.4}
.ckey{display:flex;gap:14px;font-size:12px;color:var(--appmut);margin-top:8px;flex-wrap:wrap}
.ckey s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;text-decoration:none}

/* деталь контрагента */
.detail{border:1px solid #BFE9D2;background:#F6FCF9;border-radius:12px;padding:14px;margin-top:12px;display:none}
.detail.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.detail .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.detail h5{font-size:15px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mini div{background:#fff;border:1px solid var(--appline);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--appmut)}
.mini b{display:block;font-size:15px;color:var(--apptx)}
.remind{background:#fff;border:1px dashed #9FD9B9;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:10px;display:none}
.remind.on{display:block}

.dd{position:relative}
.ddm{position:absolute;right:0;top:calc(100% + 6px);width:320px;max-width:86vw;background:#fff;border:1px solid var(--appline);border-radius:12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.25);padding:6px;display:none;z-index:8}
.ddm.on{display:block;animation:fade .2s}
.ddm .h{font-size:11.5px;color:var(--appmut);padding:6px 10px 4px}
.ddm button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--apptx);font-size:13.5px}
.ddm button:hover{background:var(--app2)}
.ddm button.on{background:#EEF8F3}
.ddm small{display:block;color:var(--appmut);font-size:12px}
.xls{width:30px;height:30px;border-radius:7px;background:#E8F8EF;color:#1E7A45;display:grid;place-items:center;font:700 9px var(--mono);flex:none}
.chg{display:none;border:1px solid #BFE9D2;background:#F6FCF9;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.chg.on{display:block;animation:fade .3s}
.chg b{display:block;margin-bottom:4px}
.chg ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px}
.chg li:before{content:"• ";color:var(--green)}
.evt{font-size:13px}
.evt div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #F0F2F4;animation:fade .35s}
.evt div:last-child{border-bottom:0}
.msg.ceo{background:#2A2F45}
.msg.ceo .who{font-size:11.5px;color:#B8A6FF;font-weight:700;margin-bottom:3px}
.msg .kb button{flex:1;min-width:46%;text-align:center;background:#22354A;border:0;border-radius:8px;padding:7px 6px;font-size:12px;color:#8FC1FF}
.msg .kb button:hover{background:#2A4260}
.msg .kb.used button{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#0F1A17;color:#fff;border:1px solid var(--ac);border-radius:12px;padding:12px 16px;font-size:14px;opacity:0;transition:.3s;z-index:50;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* калькулятор */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.fld{margin-bottom:12px}
.fld label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--appmut);margin-bottom:5px}
.fld select,.fld input[type=number]{width:100%;font:inherit;font-size:14.5px;padding:9px 11px;border:1px solid var(--appline);border-radius:10px;background:#fff;color:var(--apptx)}
.seg{display:flex;background:var(--app2);border:1px solid var(--appline);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:13px;color:var(--appmut)}
.seg button.on{background:#fff;color:var(--apptx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
input[type=range]{width:100%;accent-color:#1E9E5E}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.tiers div{text-align:center;font-size:11.5px;padding:6px 2px;border-radius:7px;background:var(--app2);color:var(--appmut);border:1px solid var(--appline)}
.tiers div.on{background:#E8F8EF;color:var(--green);border-color:#BFE9D2;font-weight:700}
.sum{background:#0F1A17;color:#F2F8F5;border-radius:12px;padding:16px}
.sum .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;color:#C9D8D1}
.sum .row b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.sum .tot{border-top:1px solid #24362F;margin-top:8px;padding-top:10px;font-size:21px;font-weight:700;color:#fff}
.sum .save{font-size:12.5px;color:#5CF2A6;margin-top:6px;min-height:18px}
.mgr{margin-top:12px;border-top:1px dashed #2C4038;padding-top:10px;display:none}
.mgr.on{display:block}
.mgr .row b.m{color:#5CF2A6}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--appmut);cursor:pointer;user-select:none;margin-top:10px}
.switch input{display:none}
.switch i{width:34px;height:20px;border-radius:99px;background:#D6DCE1;position:relative;transition:.2s;flex:none}
.switch i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:#1E9E5E}
.switch input:checked+i:after{left:16px}
.sum .switch{color:#9DB2AA}
.sum .switch i{background:#2C4038}

/* практика */
.sync{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-bottom:16px}
.log{background:#0B1116;color:#9DE7C2;font:12px/1.6 var(--mono);border-radius:10px;padding:10px 12px;height:150px;overflow:auto}
.log div{opacity:0;animation:fade .3s forwards}
.log .t{color:#5D7A6D}
.tg{display:grid;grid-template-columns:360px 1fr;gap:16px}
.phone{background:#0E1621;border-radius:22px;padding:12px;color:#E9EEF3;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;border-bottom:1px solid #1D2A38}
.ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#5CF2A6,#3E7BFA);display:grid;place-items:center;font-weight:700;color:#04110B;font-size:14px;flex:none}
.phead b{font-size:14px}.phead span{display:block;font-size:11.5px;color:#7F91A4}
.msgs{padding:12px 4px 6px;display:flex;flex-direction:column;gap:8px;height:420px;overflow-y:auto;scroll-behavior:smooth}
.msg{background:#182533;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13px;line-height:1.45;max-width:94%;animation:fade .35s}
.msg.me{align-self:flex-end;background:#2B5278;border-radius:14px 14px 4px 14px}
.msg .h{font-weight:700;margin-bottom:4px}
.msg .t{font-size:10.5px;color:#7F91A4;text-align:right;margin-top:4px}
.msg .li{display:flex;justify-content:space-between;gap:10px}
.msg .li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.msg .warnl{color:#FFB86B}
.typing{align-self:flex-start;background:#182533;border-radius:14px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#7F91A4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:8px;border-top:1px solid #1D2A38}
.cmds button{background:#22354A;border:0;border-radius:9px;padding:8px 6px;font-size:12.5px;color:#8FC1FF}
.cmds button:hover{background:#2A4260}
.cmds button:disabled{opacity:.5}
.letters{display:flex;flex-direction:column;gap:12px;min-width:0}
.ltabs{display:flex;flex-direction:column;gap:6px}
.ltab{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--appline);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--apptx)}
.ltab.on{border-color:#1E9E5E;background:#F6FCF9}
.ltab small{display:block;color:var(--appmut);font-size:12px}
.letter{border:1px solid var(--appline);border-radius:12px;padding:14px;font-size:14px}
.letter .meta{font-size:12.5px;color:var(--appmut);margin-bottom:10px;line-height:1.6}
.letter .body{background:var(--app2);border-radius:10px;padding:12px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere;min-height:150px}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.prog{height:8px;background:#EEF1F4;border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .5s}

/* профи */
.rolebar .seg button{white-space:nowrap;padding:7px 12px}
.rolebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#F2F5F7;border-bottom:1px solid var(--appline);font-size:13px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:560px}
.side{background:#0F1A17;color:#C9D8D1;padding:16px 12px;font-size:13.5px}
.side .lg{font-weight:700;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.side .lg i{width:22px;height:22px;border-radius:6px;background:var(--ac);display:inline-block}
